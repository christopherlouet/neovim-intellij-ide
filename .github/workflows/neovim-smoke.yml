name: Neovim Smoke Test

on:
  pull_request:
  push:
    branches: [main, master, lazyvim]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Neovim (official release)
        run: |
          set -e
          # Download and install Neovim AppImage
          curl -fsSL https://github.com/neovim/neovim/releases/latest/download/nvim.appimage -o /tmp/nvim.appimage
          chmod +x /tmp/nvim.appimage
          sudo mkdir -p /usr/local/bin
          sudo mv /tmp/nvim.appimage /usr/local/bin/nvim
          nvim --version

      - name: Headless startup
        run: |
          nvim --headless "+qall"

      - name: Checkhealth (non-interactive)
        run: |
          nvim --headless "+checkhealth" +qa
