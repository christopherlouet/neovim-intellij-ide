name: Install / Healthcheck

on:
  pull_request:
  push:
    branches: [main, master, lazyvim]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Ubuntu - Full installation test
  # ============================================================================
  ubuntu:
    name: Ubuntu (full install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x install.sh uninstall.sh healthcheck.sh intellij-migrate.sh clean-restart.sh || true

      - name: Install (Ubuntu)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ./install.sh --yes --prefix=$HOME/.local/bin

      - name: Healthcheck (headless)
        run: |
          ./healthcheck.sh

      - name: Verify Neovim starts correctly
        run: |
          nvim --version
          nvim --headless "+checkhealth" +qa || true

  # ============================================================================
  # Debian - Full installation test in container
  # ============================================================================
  debian:
    name: Debian (full install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:bookworm
    steps:
      - name: Install base deps for checkout
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates tar gzip sudo bash procps file libfuse3-3 fuse3

      - name: Create non-root user
        run: |
          useradd -m -s /bin/bash testuser
          echo "testuser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x install.sh uninstall.sh healthcheck.sh intellij-migrate.sh clean-restart.sh || true

      - name: Install Neovim from tarball (container-friendly)
        run: |
          # AppImage requires FUSE which is problematic in containers
          # Use tarball instead for CI testing
          NVIM_VERSION=$(curl -sL https://api.github.com/repos/neovim/neovim/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" -o /tmp/nvim.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          sudo install -m 0755 /tmp/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          sudo cp -r /tmp/nvim-linux-x86_64/lib/nvim /usr/local/lib/
          sudo cp -r /tmp/nvim-linux-x86_64/share/nvim /usr/local/share/
          rm -rf /tmp/nvim*

      - name: Install (Debian) - skip Neovim install step
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Run as testuser to simulate real user installation
          # Neovim already installed above, script will detect it
          chown -R testuser:testuser .
          su testuser -c "./install.sh --yes --prefix=/home/testuser/.local/bin"

      - name: Healthcheck (headless)
        run: |
          su testuser -c "./healthcheck.sh"

      - name: Verify Neovim starts correctly
        run: |
          su testuser -c "nvim --version"

  # ============================================================================
  # Fedora - Full installation test in container
  # ============================================================================
  fedora:
    name: Fedora (full install)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:latest
    steps:
      - name: Install base deps for checkout
        run: |
          dnf -y update
          dnf -y install git curl ca-certificates tar gzip sudo bash procps-ng file

      - name: Create non-root user
        run: |
          useradd -m -s /bin/bash testuser
          echo "testuser ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x install.sh uninstall.sh healthcheck.sh intellij-migrate.sh clean-restart.sh || true

      - name: Install (Fedora)
        run: |
          # Run as testuser to simulate real user installation
          chown -R testuser:testuser .
          su testuser -c "./install.sh --yes --prefix=/home/testuser/.local/bin"

      - name: Healthcheck (headless)
        run: |
          su testuser -c "./healthcheck.sh"

      - name: Verify Neovim starts correctly
        run: |
          su testuser -c "nvim --version"

  # ============================================================================
  # macOS - Full installation test
  # ============================================================================
  macos:
    name: macOS (full install)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x install.sh uninstall.sh healthcheck.sh intellij-migrate.sh clean-restart.sh || true

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install neovim node ripgrep fd

      - name: Install NVM and Node
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 20
          nvm use 20
          npm install -g pnpm neovim tree-sitter-cli || true

      - name: Deploy Neovim config
        run: |
          mkdir -p ~/.config
          cp -a nvim ~/.config/nvim

      - name: Install plugins
        run: |
          nvim --headless "+Lazy! sync" +qa || true

      - name: Healthcheck (headless)
        run: |
          nvim --version
          nvim --headless "+checkhealth" +qa || true

  # ============================================================================
  # Summary job for branch protection
  # ============================================================================
  ci-success:
    name: CI Success
    needs: [ubuntu, debian, fedora, macos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.ubuntu.result }}" != "success" ]] || \
             [[ "${{ needs.debian.result }}" != "success" ]] || \
             [[ "${{ needs.fedora.result }}" != "success" ]] || \
             [[ "${{ needs.macos.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI jobs passed!"
